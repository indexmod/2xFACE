<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2xFACE — настройка</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#111;color:#eee;font:14px system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:24px;display:grid;grid-template-columns:280px 1fr;gap:24px}h1{font-size:20px;margin:0 0 18px}aside{background:#1b1b1b;border:1px solid #333;border-radius:12px;padding:18px;height:max-content}label{display:block;margin:15px 0 6px;color:#bbb;font-size:12px}input[type=range]{width:100%}input[type=color]{width:100%;height:34px;border:0;background:none}output{float:right;color:#fff}button,a{display:block;width:100%;margin-top:14px;padding:10px 12px;border:1px solid #444;border-radius:8px;background:#242424;color:#fff;text-decoration:none;text-align:center;cursor:pointer}button:hover,a:hover{background:#333}#stage{height:calc(100vh - 48px);min-height:520px;border-radius:12px;overflow:hidden;background:#000}canvas{width:100%;height:100%;display:block}@media(max-width:760px){main{grid-template-columns:1fr;padding:12px}#stage{height:65vh;min-height:340px;grid-row:1}aside{grid-row:2}}</style></head><body><main><aside><h1>2xFACE / setup</h1><label>Фон</label><input id="background" type="color"><label>Заливка</label><input id="fill" type="color"><label>Края</label><input id="edge" type="color"><label>Освещение <output id="lightOut"></output></label><input id="light" type="range" min=".2" max="8" step=".1"><label>Толщина <output id="thicknessOut"></output></label><input id="thickness" type="range" min=".01" max=".2" step=".001"><label>Размер отверстий <output id="holeSizeOut"></output></label><input id="holeSize" type="range" min=".5" max="1.6" step=".01"><label>Скорость вращения <output id="speedOut"></output></label><input id="speed" type="range" min="0" max=".8" step=".01"><button id="save">Сохранить настройки</button><button id="export">Экспорт квадратного видео</button><a href="../">Открыть сцену</a><small id="status"></small></aside><section id="stage"><canvas id="model"></canvas></section></main><script src="../three.min.js"></script><script src="../scene.js"></script><script>
const fields=['background','fill','edge','light','thickness','holeSize','speed'];const defaults={background:'#000000',fill:'#ffffff',edge:'#ffffff',light:3.5,thickness:.052,holeSize:1,speed:.16};const s=Object.assign({},defaults,JSON.parse(localStorage.getItem('2xface-settings')||'{}'));fields.forEach(id=>{const e=document.getElementById(id);e.value=s[id];const o=document.getElementById(id+'Out');if(o){o.textContent=e.value;e.oninput=()=>o.textContent=e.value}});document.getElementById('save').onclick=()=>{const n={};fields.forEach(id=>n[id]=document.getElementById(id).value);n.light=+n.light;n.thickness=+n.thickness;n.holeSize=+n.holeSize;n.speed=+n.speed;localStorage.setItem('2xface-settings',JSON.stringify(n));document.getElementById('status').textContent=' Сохранено — обновите сцену';};document.getElementById('export').onclick=()=>{const c=document.getElementById('model'),size=Math.min(innerWidth,innerHeight);const out=document.createElement('canvas');out.width=out.height=1080;const x=out.getContext('2d');const stream=out.captureStream(30),chunks=[];const rec=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp9'});rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.onstop=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));a.download='2xFACE-square.webm';a.click()};rec.start();let t=0;const draw=()=>{x.drawImage(c,(c.width-size)/2,(c.height-size)/2,size,size,0,0,1080,1080);if(t++<300)requestAnimationFrame(draw);else rec.stop()};draw();document.getElementById('status').textContent=' Экспорт 10 секунд…';};
</script></body></html>
